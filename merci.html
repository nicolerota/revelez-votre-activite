<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Merci · holistic. academy</title>
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700;900&family=Montserrat:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --dark: #6B1A18; --gold: #976840; --amber: #B16637; --cream: #F5F0EA;
      --white: #FFFFFF; --text: #3B1A1A; --text-mid: #7A4A45; --border: rgba(151,104,64,0.2);
      --font-head: 'Roboto', system-ui, sans-serif; --font-body: 'Montserrat', system-ui, sans-serif;
      --radius: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-body);
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .card { max-width: 480px; }
    img { height: 56px; margin: 0 auto 32px; }
    h1 {
      font-family: var(--font-head);
      font-weight: 900;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      color: var(--dark);
      line-height: 1.15;
      margin-bottom: 16px;
    }
    p { color: var(--text-mid); font-size: 0.95rem; line-height: 1.8; margin-bottom: 32px; }
    a.btn {
      display: inline-block;
      padding: 16px 36px;
      background: var(--gold);
      color: var(--cream);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      border-radius: var(--radius);
      transition: background 0.25s;
    }
    a.btn:hover { background: var(--amber); }
  </style>
</head>
<body>
  <div class="card">
    <img src="favicon.png" alt="holistic. academy" />
    <h1>Votre demande est bien reçue.</h1>
    <p>Merci pour votre confiance. Je regarde votre activité et je reviens vers vous personnellement, très prochainement, avec votre audit.</p>
    <a href="index.html" class="btn">Retour au site</a>
  </div>
</body>
</html>
